[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "split-adjustment-tool"
version = "0.4.0"
description = "Verify, repair and apply stock-split adjustments against your own as-traded price tape."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "split-adjustment-tool contributors" },
]
keywords = [
    "corporate-actions",
    "ohlcv",
    "data-quality",
    "data-integrity",
    "stock-splits",
    "backtesting",
    "quant",
    "market-data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "polars>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/AlexBocio/split-adjustment-tool"
Repository = "https://github.com/AlexBocio/split-adjustment-tool"
Issues = "https://github.com/AlexBocio/split-adjustment-tool/issues"
Changelog = "https://github.com/AlexBocio/split-adjustment-tool/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["split_adjustment_tool*"]

[tool.setuptools.package-data]
split_adjustment_tool = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
# Config dataclasses (ChainConfig(), GuardConfig(), ...) are used as defaults on purpose: they are
# never mutated by the functions that receive them.
ignore = ["B008"]
